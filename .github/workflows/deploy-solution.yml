name: Deploy Power Platform Solution

on:
  push:
    branches:
      - main
    paths:
      - 'src/**' # Executa apenas se houver altera es na solu o
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest # Recomendado para usar o pac CLI nativamente
    
    steps:
      # Baixar o código do repositório para o Runner
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Incrementar a versão do agente
      - name: Incrementar Versão da Solução
        run: |
          Write-Host "Diretório de Trabalho Atual: $env:GITHUB_WORKSPACE"
          
          $xmlPath = Join-Path $env:GITHUB_WORKSPACE "src\Other\Solution.xml"
          
          if (-not (Test-Path $xmlPath)) {
            Write-Error "ERRO CRÍTICO: O arquivo Solution.xml não foi encontrado em: $xmlPath"
            exit 1
          }
          
          [xml]$xml = Get-Content $xmlPath
          
          $runNumber = ${{ github.run_number }}
          
          $newVersion = "1.0.0.$runNumber"
          $xml.ImportExportXml.SolutionManifest.Version = $newVersion
          $xml.Save($xmlPath)
          
          $zipVersion = $newVersion -replace '\.', '_'
          echo "ZIP_VERSION=$zipVersion" >> $env:GITHUB_ENV
        shell: powershell

      - name: Empacotar Solução (Pack)
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: 'src'
          solution-file: 'DelphiTDD_Solution_${{ env.ZIP_VERSION }}.zip'
          solution-type: 'Unmanaged'

      - name: Autenticar e Importar Solução via PAC CLI
        run: |
          Write-Host "Iniciando autenticação via PAC CLI..."
          
          # Localiza o executável do pac instalado pelo GitHub Action anterior
          $pacPath = $env:POWERPLATFORMTOOLS_PACPATH
          
          if (-not $pacPath -or -not (Test-Path $pacPath)) {
            # Fallback caso a variável não venha preenchida
            $pacPath = "pac"
          }

          Write-Host "Usando o executável PAC em: $pacPath"

          # Autentica usando o Service Principal diretamente no ambiente
          & $pacPath auth create --applicationId "${{ secrets.POWERPLATFORM_CLIENT_ID }}" --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" --tenant "${{ secrets.POWERPLATFORM_TENANT_ID }}" --url "${{ secrets.POWERPLATFORM_ENV_URL }}"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha na autenticação com a CLI."
            exit 1
          }

          Write-Host "Autenticação realizada com sucesso! Importando a solução..."

          $solutionFile = "DelphiTDD_Solution_${{ env.ZIP_VERSION }}.zip"

          # Importa a solução
          & $pacPath solution import --path $solutionFile --publish-changes --force-overwrite

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha ao importar a solução."
            exit 1
          }

          Write-Host "Solução importada com sucesso!"
        shell: powershell
