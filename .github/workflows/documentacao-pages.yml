name: Documentação · GitHub Pages

on:
  pull_request:
    paths:
      - 'Documentacoes/app/**'
      - 'Documentacoes/config/**'
      - 'Documentacoes/package*.json'
      - 'Documentacoes/tsconfig.json'
      - 'docs/MAPEAMENTO_AST_USES_UNITS/**'
      - 'docs/assets/**'
      - 'index.html'
      - '.github/workflows/documentacao-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentacao-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Documentacoes/package-lock.json
      - run: npm ci --prefix Documentacoes
      - run: npm run check --prefix Documentacoes
      - run: npm run build --prefix Documentacoes
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: Documentacoes/.pages-output
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
