name: Deploy Knowledge Base

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Instalar MkDocs
        run: pip install mkdocs
        
      - name: Preparar arquivos do MkDocs
        run: |
          mkdir src_docs
          cp README.md src_docs/index.md
          cp AGENTS.md src_docs/
          cp -r docs/ src_docs/docs/
          cp -r skills/ src_docs/skills/
          
      - name: Publicar no GitHub Pages
        run: mkdocs gh-deploy --force